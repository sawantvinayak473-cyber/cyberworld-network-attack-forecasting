
# Note: The primary production deployment is orchestrated from the project root.
# Run: docker compose -f ../docker-compose.yml up --build

services:
  cyberworld-backend:
    build:
      context: ..
      dockerfile: cyberworld/Dockerfile
    container_name: cyberworld-backend
    ports:
      - "8000:8000"
    environment:
      - CYBERWORLD_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CYBERWORLD_API_KEY=${CYBERWORLD_API_KEY:-}
    volumes:
      - ../artifacts:/app/artifacts
      - ./configs:/app/cyberworld/configs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
