name: CyberWorld CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test-suite:
    name: Backend PyTorch ML & SOC Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cyberworld/requirements.txt
          pip install pytest httpx

      - name: Run Python Automated Test Suite (46 Tests)
        run: |
          python -m unittest cyberworld/tests/test_suite.py -v

  frontend-build:
    name: Frontend React 19 & TypeScript Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Build React Dashboard (Vite)
        run: |
          npm run build

  docker-lint:
    name: Dockerfile & Compose Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Config
        run: |
          docker compose config
